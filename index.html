<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LoL Leggyengébb Roller</title>
<style>
:root{--bg:#060914;--card:rgba(18,26,52,.74);--bd:rgba(120,140,220,.16);--tx:#e8ecff;--mut:#8590b8;--ac:#8b7bff;--ac2:#5ec8ff;--gold:#e6c577}
*{box-sizing:border-box;margin:0}
body{overflow-x:hidden;min-height:100vh;color:var(--tx);font-family:"Segoe UI",system-ui,sans-serif;background:radial-gradient(900px 520px at 10% -10%,rgba(139,123,255,.24),transparent 60%),radial-gradient(800px 500px at 100% 0,rgba(94,200,255,.14),transparent 55%),var(--bg);background-attachment:fixed;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:1020px;margin:0 auto;padding:30px 16px 56px}
header{text-align:center;margin-bottom:26px}
h1{font-size:30px;font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,var(--ac2),var(--ac),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:13px;margin-top:5px}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.lbl{font-size:11px;letter-spacing:2px;color:var(--mut);font-weight:700;text-transform:uppercase;margin-bottom:12px}
aside{position:sticky;top:16px}
@media(max-width:820px){aside{position:static}}
.pn{font-size:20px;font-weight:800}.pr{font-size:12.5px;color:var(--mut);margin-top:2px}
.badge{display:inline-block;margin:12px 0 4px;padding:6px 14px;border-radius:999px;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--ac),#5b7bff);box-shadow:0 0 20px rgba(139,123,255,.4)}
.pw{font-size:44px;font-weight:800;color:var(--ac2);line-height:1;margin-top:14px;text-shadow:0 0 24px rgba(94,200,255,.35)}
.pw small{display:block;font-size:11px;letter-spacing:2px;color:var(--mut);margin-top:6px;text-shadow:none}
.form{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:16px 0 8px}
.form i{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:12px}
.W{background:rgba(70,200,140,.18);color:#5ee0a4;border:1px solid rgba(70,200,140,.5)}
.L{background:rgba(255,100,110,.15);color:#ff7b86;border:1px solid rgba(255,100,110,.45)}
.R{background:rgba(150,160,190,.15);color:var(--mut);border:1px solid var(--bd)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px}
.tab{flex:1;min-width:84px;padding:10px 8px;border-radius:10px;border:1px solid var(--bd);background:rgba(255,255,255,.03);color:var(--mut);cursor:pointer;font-size:14px;font-weight:600;transition:.2s}
.tab:hover{color:var(--tx)}.tab.on{color:#fff;border-color:var(--ac);background:linear-gradient(135deg,rgba(139,123,255,.45),rgba(94,200,255,.22));box-shadow:0 0 18px rgba(139,123,255,.35)}
.layout>*{min-width:0}
.vp{width:100%;max-width:100%;position:relative;height:124px;overflow:hidden;border-radius:14px;border:1px solid var(--bd);background:rgba(5,8,20,.7)}
.vp::before,.vp::after{content:"";position:absolute;top:0;bottom:0;width:22%;z-index:2;pointer-events:none}
.vp::before{left:0;background:linear-gradient(90deg,#060914,transparent)}.vp::after{right:0;background:linear-gradient(270deg,#060914,transparent)}
.mark{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;z-index:3;background:linear-gradient(var(--gold),var(--ac2));box-shadow:0 0 16px var(--gold)}
.track{width:max-content;display:flex;height:100%;align-items:center;will-change:transform}
.it{flex:0 0 92px;display:flex;flex-direction:column;align-items:center;gap:5px;transition:.3s}
.it .av{width:64px;height:64px}.it b{font-size:11px;font-weight:600;max-width:84px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.win{transform:scale(1.18)}.it.win .av{border-color:var(--gold);box-shadow:0 0 22px rgba(230,197,119,.7)}
.av{border-radius:50%;background:#0b1020 center/cover;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:700}
.btns{display:flex;gap:8px;margin:16px 0}
button.p{flex:2;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:800;letter-spacing:1px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--ac),#5b7bff);box-shadow:0 6px 24px rgba(139,123,255,.45);transition:.15s}
button.p:hover:not(:disabled){transform:translateY(-1px)}button.p:disabled{opacity:.6;cursor:default}
button.s{flex:1;padding:14px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;font-size:14px;font-weight:600}
button.s:hover{border-color:var(--ac2)}
.res{display:flex;align-items:center;gap:16px;padding:14px;border-radius:14px;border:1px solid rgba(230,197,119,.4);background:rgba(230,197,119,.07);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
.res .av{width:76px;height:76px;border-color:var(--gold);box-shadow:0 0 28px rgba(230,197,119,.5)}
.rn{font-size:26px;font-weight:800;color:var(--gold)}.rw{font-size:13px;color:var(--mut)}
.status{font-size:12.5px;color:var(--mut);margin:18px 0 10px}.status.warn{color:#ff9d8a}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.ch{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:1px solid transparent;background:rgba(255,255,255,.03)}
.ch .av{width:50px;height:50px}.ch b{font-size:12px;font-weight:600;text-align:center}.ch span{font-size:11px;color:var(--ac2)}
.ch.hit{border-color:var(--gold);background:rgba(230,197,119,.1);box-shadow:0 0 16px rgba(230,197,119,.25)}
.ch .ln{font-size:10px;letter-spacing:1px;color:var(--mut);text-transform:uppercase}
</style>
</head>
<body>
<main>
<header><h1>⚔ LEGGYENGÉBB ROLLER</h1><div class="sub">A te rangodhoz mért mai 10 legalacsonyabb winrate-ű champ lane-enként</div></header>
<div class="layout">
  <aside><div class="card"><div class="lbl">Profil</div><div id="prof" class="sub">Betöltés…</div></div></aside>
  <section class="card">
    <div class="lbl">Roller</div>
    <div class="tabs" id="tabs"></div>
    <div class="vp"><div class="mark"></div><div class="track" id="track"></div></div>
    <div class="btns"><button class="p" id="roll">🎲 PÖRGETÉS</button><button class="s" id="rollAll">Mind az 5 lane</button></div>
    <div id="out"></div>
    <div class="status" id="status"></div>
    <div class="grid" id="grid"></div>
  </section>
</div>
</main>
<script>
const LANES=["Top","Jungle","Mid","Bot","Support"],W=92;
let cur="Top",data=null,ver=null,idMap={},busy=false;
const $=id=>document.getElementById(id),norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TL={ibsg:"Iron–Gold",gold_plus:"Gold+",platinum_plus:"Platinum+",emerald_plus:"Emerald+",diamond_plus:"Diamond+",master_plus:"Master+",grandmaster_plus:"Grandmaster+",challenger:"Challenger"};
function imgUrl(n){if(!ver)return null;const k=norm(n);let id=idMap[k];if(!id){const f=Object.keys(idMap).find(x=>x.startsWith(k)||k.startsWith(x));if(f)id=idMap[f]}return id?`https://ddragon.leagueoflegends.com/cdn/${ver}/img/champion/${id}.png`:null}
function av(n){const u=imgUrl(n);return u?`<div class="av" style="background-image:url('${u}')"></div>`:`<div class="av">${esc(n[0])}</div>`}
const items=l=>data&&data.lanes&&data.lanes[l]||[];
function tabs(){$("tabs").innerHTML="";LANES.forEach(l=>{const b=document.createElement("button");b.className="tab"+(l===cur?" on":"");b.textContent=l;b.onclick=()=>{if(busy)return;cur=l;$("out").innerHTML="";$("track").innerHTML="";$("track").style.transform="none";render()};$("tabs").appendChild(b)})}
function render(){
  tabs();const L=items(cur),st=$("status");st.className="status";$("grid").innerHTML="";
  if(!data){st.textContent="Betöltés…";return}
  if(!L.length){st.className="status warn";st.textContent="Ehhez a lane-hez nincs adat.";return}
  const old=data.date!==new Date().toISOString().slice(0,10);
  st.textContent=(old?"⚠ Utolsó frissítés: ":"✔ Mai lista – ")+data.date+" · Szűrő: "+(TL[data.tier]||"alapértelmezett (Emerald+)");if(old)st.className="status warn";
  $("grid").innerHTML=L.map((c,i)=>`<div class="ch" id="c${i}">${av(c.n)}<b>${esc(c.n)}</b><span>${c.w?c.w+"%":""}</span></div>`).join("");
}
function item(c,w){return `<div class="it${w?" win":""}">${av(c.n)}<b>${esc(c.n)}</b></div>`}
function spin(){
  const L=items(cur);if(!L.length||busy)return;busy=true;$("roll").disabled=true;$("out").innerHTML="";
  document.querySelectorAll(".ch.hit").forEach(x=>x.classList.remove("hit"));
  const N=46,win=38+Math.floor(Math.random()*4),wi=Math.floor(Math.random()*L.length),seq=[];let last=-1;
  for(let i=0;i<N;i++){let k;do{k=Math.floor(Math.random()*L.length)}while(k===last&&L.length>1);seq.push(k);last=k}
  seq[win]=wi;const t=$("track");
  t.style.transition="none";t.style.transform="translateX(0)";t.innerHTML=seq.map(k=>item(L[k],false)).join("");t.offsetWidth;
  const off=win*W+W/2-$("track").parentElement.clientWidth/2+(Math.random()-.5)*W*.45;
  t.style.transition="transform 5s cubic-bezier(.1,.75,.08,1)";t.style.transform=`translateX(${-off}px)`;
  setTimeout(()=>{
    t.children[win].classList.add("win");const c=L[wi];
    $("out").innerHTML=`<div class="res">${av(c.n)}<div><div class="rn">${esc(c.n)}</div><div class="rw">${esc(cur)}${c.w?" · winrate: "+c.w+"%":""}</div></div></div>`;
    const e=$("c"+wi);if(e)e.classList.add("hit");busy=false;$("roll").disabled=false;
  },5100);
}
function rollAll(){
  if(busy)return;$("track").innerHTML="";
  $("out").innerHTML='<div class="grid">'+LANES.map(l=>{const L=items(l);if(!L.length)return"";const c=L[Math.floor(Math.random()*L.length)];return `<div class="ch hit"><div class="ln">${l}</div>${av(c.n)}<b>${esc(c.n)}</b><span>${c.w?c.w+"%":""}</span></div>`}).join("")+"</div>";
}
$("roll").onclick=spin;$("rollAll").onclick=rollAll;
async function profile(){
  try{const p=await(await fetch("profile.json?"+Date.now())).json();
    const w=p.last10.filter(x=>x==="W").length,l=p.last10.filter(x=>x==="L").length;
    $("prof").className="";
    $("prof").innerHTML=`<div class="pn">${esc(p.name)}</div><div class="pr">${esc(p.region)}${p.record?" · "+esc(p.record):""}</div>
    ${p.rank?`<div class="badge">${esc(p.rank)}${p.lp?" · "+esc(p.lp)+" LP":""}</div>`:""}
    <div class="pw">${p.winrate?esc(p.winrate)+"%":"–"}<small>WINRATE</small></div>
    <div class="form">${p.last10.map(r=>`<i class="${r}">${r}</i>`).join("")}</div><div class="pr">Utolsó ${p.last10.length} meccs: ${w}W – ${l}L</div>${p.updated?`<div class="pr" style="margin-top:6px;opacity:.7">Frissítve: ${new Date(p.updated).toLocaleString("hu-HU",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}</div>`:""}`;
  }catch(e){$("prof").textContent="A profil még nem töltődött be."}
}
async function init(){
  tabs();profile();setInterval(profile,300000);
  try{data=await(await fetch("data.json?"+Date.now())).json()}catch(e){$("status").className="status warn";$("status").textContent="A data.json még nem készült el – futtasd az Actions workflow-t.";return}
  render();
  try{ver=(await(await fetch("https://ddragon.leagueoflegends.com/api/versions.json")).json())[0];
    const cj=await(await fetch(`https://ddragon.leagueoflegends.com/cdn/${ver}/data/en_US/champion.json`)).json();
    Object.values(cj.data).forEach(c=>{idMap[norm(c.name)]=c.id;idMap[norm(c.id)]=c.id});render()}catch(e){}
}
init();
</script>
</body>
</html>
