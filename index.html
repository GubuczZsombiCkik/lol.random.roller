<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LoL Leggyengébb Roller</title>
<style>
:root{--bg:#070b16;--bg2:#0d1428;--card:rgba(20,29,56,.72);--bd:rgba(120,140,220,.18);--tx:#e8ecff;--mut:#8590b8;--ac:#8b7bff;--ac2:#5ec8ff;--gold:#e6c577}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100vh;color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  background:radial-gradient(900px 500px at 15% -10%,rgba(139,123,255,.22),transparent 60%),
             radial-gradient(800px 500px at 100% 0%,rgba(94,200,255,.14),transparent 55%),
             linear-gradient(180deg,var(--bg2),var(--bg));background-attachment:fixed;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:760px;margin:0 auto;padding:28px 16px 48px}
header{text-align:center;margin-bottom:22px}
h1{font-size:28px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,var(--ac2),var(--ac),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.tab{flex:1;min-width:88px;padding:11px 8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--mut);cursor:pointer;font-size:14px;font-weight:600;transition:.2s;backdrop-filter:blur(6px)}
.tab:hover{color:var(--tx)}
.tab.on{color:#fff;border-color:var(--ac);background:linear-gradient(135deg,rgba(139,123,255,.45),rgba(94,200,255,.25));box-shadow:0 0 18px rgba(139,123,255,.35)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px;backdrop-filter:blur(8px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0 14px}
.big{width:128px;height:128px;border-radius:50%;border:3px solid var(--ac);background:#0b1020 center/cover;box-shadow:0 0 34px rgba(139,123,255,.55);display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--mut);transition:.15s}
.big.spin{animation:pulse .35s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 50px rgba(94,200,255,.8);border-color:var(--ac2)}}
.rname{font-size:30px;font-weight:800;color:var(--gold);min-height:38px;text-align:center;text-shadow:0 0 20px rgba(230,197,119,.3)}
.rwr{color:var(--mut);font-size:14px;min-height:20px}
.btns{display:flex;gap:8px}
button.p{flex:2;padding:13px;border:0;border-radius:11px;font-size:16px;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--ac),#5b7bff);box-shadow:0 6px 24px rgba(139,123,255,.45);transition:.15s}
button.p:hover{transform:translateY(-1px)}
button.s{flex:1;padding:13px;border-radius:11px;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;font-size:14px;font-weight:600}
button.s:hover{border-color:var(--ac2)}
.status{font-size:12.5px;color:var(--mut);text-align:center;margin:12px 0 4px}
.status.warn{color:#ff9d8a}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
@media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr)}.rname{font-size:24px}}
.ch{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:12px;border:1px solid transparent;background:rgba(255,255,255,.03);transition:.15s}
.ch .av{width:54px;height:54px;border-radius:50%;background:#0b1020 center/cover;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:700}
.ch b{font-size:12px;font-weight:600;text-align:center;line-height:1.15}
.ch span{font-size:11px;color:var(--ac2)}
.ch.hit{border-color:var(--gold);background:rgba(230,197,119,.1);transform:scale(1.06);box-shadow:0 0 18px rgba(230,197,119,.3)}
.ch.hit .av{border-color:var(--gold)}
.all{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:520px){.all{grid-template-columns:repeat(3,1fr)}}
.all .ch .lane{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--mut)}
.all h3{grid-column:1/-1;font-size:14px;color:var(--mut);font-weight:600}
</style>
</head>
<body>
<main>
  <header>
    <h1>⚔ LEGGYENGÉBB ROLLER</h1>
    <div class="sub">A mai 10 legalacsonyabb winrate-ű champ lane-enként – rollolj közülük</div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="card">
    <div class="stage">
      <div class="big" id="big">?</div>
      <div class="rname" id="rname">Készen állsz?</div>
      <div class="rwr" id="rwr"></div>
    </div>
    <div class="btns">
      <button class="p" id="roll">🎲 ROLL</button>
      <button class="s" id="rollAll">Mind az 5 lane</button>
    </div>
    <div class="status" id="status">Betöltés…</div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="card" id="allCard" hidden><div class="all" id="all"></div></div>
</main>
<script>
const LANES=["Top","Jungle","Mid","Bot","Support"];
let cur="Top",data=null,timer=null,ver=null,idMap={};
const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function img(name){
  if(!ver)return null;
  const k=norm(name);
  let id=idMap[k];
  if(!id){const f=Object.keys(idMap).find(x=>x.startsWith(k)||k.startsWith(x));if(f)id=idMap[f]}
  return id?`https://ddragon.leagueoflegends.com/cdn/${ver}/img/champion/${id}.png`:null;
}
function setAv(el,name){
  const u=img(name);
  if(u){el.style.backgroundImage=`url("${u}")`;el.textContent=""}
  else{el.style.backgroundImage="none";el.textContent=name.slice(0,1)}
}
function items(l){return data&&data.lanes&&data.lanes[l]?data.lanes[l]:[]}

function renderTabs(){
  $("tabs").innerHTML="";
  LANES.forEach(l=>{
    const b=document.createElement("button");
    b.className="tab"+(l===cur?" on":"");b.textContent=l;
    b.onclick=()=>{cur=l;resetStage();render()};
    $("tabs").appendChild(b);
  });
}
function resetStage(){$("big").style.backgroundImage="none";$("big").textContent="?";$("rname").textContent="Készen állsz?";$("rwr").textContent=""}
function render(){
  renderTabs();
  const list=items(cur),g=$("grid");g.innerHTML="";
  const st=$("status");st.className="status";
  if(!data){st.textContent="Betöltés…";return}
  if(!list.length){st.className="status warn";st.textContent="Ehhez a lane-hez nincs adat.";return}
  const old=data.date!==new Date().toISOString().slice(0,10);
  st.textContent=old?`⚠ A lista frissítve: ${data.date} (a mai még nem érkezett meg)`:`✔ Mai lista – ${data.date}`;
  if(old)st.className="status warn";
  list.forEach((c,i)=>{
    const d=document.createElement("div");d.className="ch";d.id="c"+i;
    d.innerHTML=`<div class="av"></div><b>${esc(c.n)}</b><span>${c.w?c.w+"%":""}</span>`;
    setAv(d.querySelector(".av"),c.n);g.appendChild(d);
  });
}
function show(c){
  $("rname").textContent=c.n;$("rwr").textContent=c.w?`Winrate: ${c.w}%`:"";
  setAv($("big"),c.n);
}
function mark(i){document.querySelectorAll(".ch.hit").forEach(x=>x.classList.remove("hit"));const e=$("c"+i);if(e)e.classList.add("hit")}
function roll(){
  const list=items(cur);if(!list.length)return;
  clearInterval(timer);$("big").classList.add("spin");
  let n=0;
  timer=setInterval(()=>{
    const i=Math.floor(Math.random()*list.length);show(list[i]);mark(i);
    if(++n>=16){
      clearInterval(timer);$("big").classList.remove("spin");
      const f=Math.floor(Math.random()*list.length);show(list[f]);mark(f);
    }
  },75);
}
function rollAll(){
  const box=$("all");box.innerHTML="<h3>Mind az 5 lane eredménye</h3>";
  LANES.forEach(l=>{
    const list=items(l);if(!list.length)return;
    const c=list[Math.floor(Math.random()*list.length)];
    const d=document.createElement("div");d.className="ch hit";
    d.innerHTML=`<div class="lane">${l}</div><div class="av"></div><b>${esc(c.n)}</b><span>${c.w?c.w+"%":""}</span>`;
    setAv(d.querySelector(".av"),c.n);box.appendChild(d);
  });
  $("allCard").hidden=false;
}
$("roll").onclick=roll;$("rollAll").onclick=rollAll;

async function init(){
  renderTabs();
  try{
    const r=await fetch("data.json?"+Date.now());
    data=await r.json();
  }catch(e){$("status").className="status warn";$("status").textContent="A data.json még nem készült el – futtasd az Actions workflow-t.";return}
  render();
  try{
    const v=await (await fetch("https://ddragon.leagueoflegends.com/api/versions.json")).json();
    ver=v[0];
    const cj=await (await fetch(`https://ddragon.leagueoflegends.com/cdn/${ver}/data/en_US/champion.json`)).json();
    Object.values(cj.data).forEach(c=>{idMap[norm(c.name)]=c.id;idMap[norm(c.id)]=c.id});
    render();
  }catch(e){}
}
init();
</script>
</body>
</html>
